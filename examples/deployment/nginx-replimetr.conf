# TEMPLATE for a VM with nginx and a loopback-only hosted Uvicorn process.
# Replace example.invalid, certificate paths and the password-file path.
# This is NOT a configuration for the existing alwaysdata User program.
server {
    listen 80;
    server_name example.invalid;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name example.invalid;
    ssl_certificate /etc/letsencrypt/live/example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "Replimetr team and jury";
    auth_basic_user_file /etc/nginx/private/replimetr.htpasswd;
    client_max_body_size 8m;
    # Dialogues and authenticated responses must not enter a shared proxy cache.
    proxy_cache off;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        # The proxy validates these credentials; the application does not need them.
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 200s;
        proxy_send_timeout 200s;
        proxy_next_upstream off;
    }
}
