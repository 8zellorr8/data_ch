name: Backend tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Reject committed API keys
        run: python -m scripts.check_secrets
      - run: python -m pip install -e ".[dev]" -c requirements-lock.txt
      - run: python -m ruff check backend ai scripts tests
      - run: python -m ruff format --check backend ai scripts tests
      - run: python -m mypy backend ai
      - name: Unit tests
        run: python -m pytest tests/unit -q
      - name: Integration tests
        run: python -m pytest tests/integration -q -o faulthandler_timeout=30
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]" -c requirements-lock.txt
      - name: Docker startup, API compatibility and SQLite persistence
        run: python -m scripts.docker_smoke
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm --prefix frontend run check
      - run: npm --prefix frontend test
      - run: python -m unittest discover -s frontend/tests -p "test_*.py"
